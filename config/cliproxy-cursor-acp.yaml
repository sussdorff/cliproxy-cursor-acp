# Place this mapping under plugins.configs.cliproxy-cursor-acp in CLIProxyAPI.
executable: /usr/local/bin/agent
max_concurrent: 2
max_prompt_bytes: 524288
max_output_bytes: 1048576
timeout: 2m
workspace_root: /srv/cliproxy-cursor-acp/workspace
accounts:
  - auth_id: cursor-personal
    label: Personal Cursor subscription
    profile_dir: /srv/cursor-profiles/cursor-personal
    model: cursor/auto
  - auth_id: cursor-work
    label: Work Cursor subscription
    profile_dir: /srv/cursor-profiles/cursor-work
    model: cursor/auto
